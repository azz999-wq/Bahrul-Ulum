<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Berita - Bahrul Ulum Singaparna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
    }

    .detail-wrapper {
      max-width: 860px;
      margin: 120px auto 60px;
      padding: 0 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
      transition: color 0.2s ease;
    }

    .back-btn:hover {
      color: var(--secondary);
    }

    .article-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(24px, 4vw, 40px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .article-badge {
      display: inline-block;
      padding: 5px 12px;
      background: var(--blue-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.8px;
      border-radius: 6px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .article-title {
      font-size: clamp(26px, 3.8vw, 38px);
      color: var(--primary);
      margin-bottom: 10px;
      line-height: 1.25;
      font-weight: 800;
    }

    .article-date {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
      display: block;
    }

    .article-cover {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 28px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }

    .article-content {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-line;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/BU.png" alt="Logo Bahrul Ulum" class="logo-img">
        <div>
          <strong>Bahrul Ulum</strong>
          <span>Singaparna</span>
        </div>
      </a>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Buka menu">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="index.html#beranda">Beranda</a>
        <a href="index.html#profil">Profil</a>
        <a href="index.html#pendidikan">Pendidikan</a>
        <a href="berita.html" class="active">Berita</a>
        <a href="index.html#kontak" class="nav-cta">PPDB</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="detail-wrapper">
      <a href="berita.html" class="back-btn">← Kembali ke Daftar Berita</a>
      
      <div class="article-card" id="articleDetail">
        <p style="text-align: center; color: var(--muted);">Memuat isi berita...</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <div><strong>Bahrul Ulum Singaparna</strong><span>Ilmu • Akhlak • Khidmah</span></div>
      <small>© 2026 Bahrul Ulum Singaparna. Semua hak dilindungi.</small>
    </div>
  </footer>

  <script src="script.js"></script>

  <!-- FIREBASE READ DETAIL SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // GANTI DENGAN FIREBASE CONFIG ASLI KAMU
  const firebaseConfig = {
  apiKey: "AIzaSyCpRE_tUyT1fjL88PN0bZ5emS3S4Hn64_s",
  authDomain: "bahrul-ulum-web.firebaseapp.com",
  projectId: "bahrul-ulum-web",
  storageBucket: "bahrul-ulum-web.firebasestorage.app",
  messagingSenderId: "378515606416",
  appId: "1:378515606416:web:95f56f222bd566aef6c115",
  measurementId: "G-9G8T5RR5W6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function escapeHTML(str) {
    if(!str) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  // FUNGSI KONVERSI LINK YOUTUBE KE FORMAT EMBED PLAYER
  function getYouTubeEmbedURL(url) {
    if (!url) return '';
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : '';
  }

  async function loadDetail() {
    const container = document.getElementById('articleDetail');
    
    const urlParams = new URLSearchParams(window.location.search);
    const newsId = urlParams.get('id');

    if (!newsId) {
      container.innerHTML = "<p style='text-align:center;'>Berita tidak ditemukan.</p>";
      return;
    }

    try {
      const docRef = doc(db, "berita", newsId);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const d = docSnap.data();
        
        // Deteksi Embed YouTube
        const embedUrl = getYouTubeEmbedURL(d.video_url);

        // Jika ada link Video YouTube, tampilkan Player Video
        let mediaHTML = '';
        if (embedUrl) {
          mediaHTML = `
            <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; margin-bottom: 28px; background: #000;">
              <iframe src="${embedUrl}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe>
            </div>
          `;
        } else if (d.gambar_url) {
          // Jika tidak ada video, tampilkan Foto Cover
          mediaHTML = `<img src="${escapeHTML(d.gambar_url)}" alt="${escapeHTML(d.judul)}" class="article-cover" onerror="this.style.display='none'">`;
        }

        container.innerHTML = `
          <span class="article-badge">${escapeHTML(d.kategori)}</span>
          <h1 class="article-title">${escapeHTML(d.judul)}</h1>
          <span class="article-date">Diterbitkan: ${escapeHTML(d.tanggal)}</span>
          
          ${mediaHTML}
          
          <div class="article-content">
            ${escapeHTML(d.ringkasan)}
          </div>
        `;
      } else {
        container.innerHTML = "<p style='text-align:center;'>Berita tidak ditemukan atau telah dihapus.</p>";
      }
    } catch (e) {
      console.error("Error:", e);
      container.innerHTML = "<p style='text-align:center;'>Gagal memuat isi berita.</p>";
    }
  }

  document.addEventListener("DOMContentLoaded", loadDetail);
</script>
</body>
</html>
